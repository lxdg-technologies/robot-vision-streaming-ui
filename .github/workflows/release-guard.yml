name: Release workflow guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    name: Release guard order and behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Test release guard
        run: python -m unittest discover -s tests -p test_release_workflow_guard.py -v
