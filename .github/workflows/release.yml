name: Release container

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "Repository must contain a VERSION file." >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          python3 - "${VERSION}" <<'PY'
          import re, sys
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", sys.argv[1]):
              raise SystemExit(f"Invalid semantic version: {sys.argv[1]}")
          PY
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Checkout shared submodule
        env:
          SUBMODULE_TOKEN: ${{ secrets.GH_SUBMODULE_TOKEN || secrets.ROBOT_SHARED_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            test -n "${SUBMODULE_TOKEN}" || { echo "GH_SUBMODULE_TOKEN is required" >&2; exit 1; }
            git config --global --add url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
            git submodule sync --recursive
            git submodule update --init --recursive
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Verify release source
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const missing=['check','test','build','ci'].filter(name => !p.scripts?.[name]); if (missing.length) { console.error('Missing required scripts: ' + missing.join(', ')); process.exit(1); }"
          bun install --frozen-lockfile
          bun run ci
      - name: Build and smoke-test release container
        run: |
          docker build --tag robot-vision-streaming-ui:release-smoke .
          testing/test-container.sh robot-vision-streaming-ui:release-smoke
      - uses: docker/setup-buildx-action@v3
      - name: Resolve build metadata
        id: build-meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha,prefix=
      - name: Verify version is not already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED_COMMIT=$(git rev-list -n 1 "${TAG}")
            if [ "${TAGGED_COMMIT}" != "$(git rev-parse HEAD)" ]; then
              LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
              echo "::error::${TAG} was already released from commit ${TAGGED_COMMIT}. Highest released tag is ${LATEST}; bump VERSION above it and merge again."
              exit 1
            fi
            echo "${TAG} already points at this commit; re-running the release is safe."
          fi
      - name: Build and publish once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA_SHORT=${{ steps.build-meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create immutable Git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "${TAG}")" = "$(git rev-parse HEAD)" || { echo "${TAG} already points to another commit" >&2; exit 1; }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --generate-notes --notes "Container: ghcr.io/${GITHUB_REPOSITORY}:${TAG}\n\nDigest: ${DIGEST}"

  dispatch-deployment:
    name: Request deployment
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPLOYMENT_DISPATCH_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Dispatch centralized deployment
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh api --method POST repos/lxdg-technologies/robot-deployment-stacks/dispatches \
            -f event_type=container_published \
            -F "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=v${VERSION}" \
            -F "client_payload[sha]=${GITHUB_SHA}"
      - name: Explain skipped deployment
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "DEPLOYMENT_DISPATCH_TOKEN is not configured; image was published but deployment was not requested." >> "$GITHUB_STEP_SUMMARY"
